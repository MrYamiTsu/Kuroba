<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Playground — Kuroba</title>
  <link rel="icon" type="image/png" href="assets/kuroba.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body class="ide-body">

  <!-- ========================================================================
       Header / Navigation Bar
       ======================================================================== -->
  <header class="site-header">
    <a href="index.html" class="brand">
      <img src="assets/kuroba.png" alt="Kuroba Logo" class="logo">
      <span class="brand-name">Kuroba</span>
      <span class="version-badge">v1.0.6</span>
    </a>

    <nav class="main-nav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="docs.html" class="nav-link">Documentation</a>
      <a href="playground.html" class="nav-link active">Playground ▶</a>
      <a href="https://github.com/MrYamiTsu/Kuroba" target="_blank" rel="noopener noreferrer" class="nav-link">GitHub ↗</a>
    </nav>
  </header>

  <!-- ========================================================================
       Playground Fullscreen Interface (Editor 50% | Terminal 50%)
       ======================================================================== -->
  <main class="playground-fullscreen">
    
    <!-- Left Panel: Code Editor -->
    <div class="ide-panel ide-panel-editor">
      <div class="ide-toolbar">
        <div class="ide-toolbar-left">
          <span class="ide-toolbar-title">Editor</span>
        </div>

        <div class="ide-toolbar-right">
          <button class="ide-btn" id="btn-clear-editor" title="Clear active file content">Clear</button>
          <button class="ide-btn ide-btn-stop" id="btn-stop" title="Stop execution (Ctrl + C)" style="display: none;">Stop ■</button>
          <button class="ide-btn ide-btn-run" id="btn-execute" title="Run main.krb (Ctrl + Enter)">Run main.krb ▶</button>
        </div>
      </div>

      <!-- Multi-File Workspace Tabs (main.krb is pinned as entry point) -->
      <div class="ide-file-tabs" id="ide-file-tabs">
        <div class="ide-file-tabs-list" id="ide-file-tabs-list"></div>
        <button class="ide-add-file-btn" id="btn-add-file" title="Create new .krb module file">+ New File</button>
      </div>

      <!-- Editor Body with Synchronized Line Numbers -->
      <div class="ide-editor-container">
        <div class="ide-line-numbers" id="ide-gutter"></div>
        <textarea class="ide-textarea" id="ide-editor" spellcheck="false" placeholder="Write Kuroba (.krb) code here..."></textarea>
      </div>

      <!-- Bottom Status Bar -->
      <div class="ide-statusbar">
        <span class="ide-status-item" id="status-active-file">
          <span class="status-indicator">●</span> Entry: main.krb
        </span>
        <span class="ide-status-item" id="status-cursor">Ln 1, Col 1</span>
        <span class="ide-status-item ide-shortcuts-hint">[Ctrl+Enter] Run &nbsp;•&nbsp; [Ctrl+L] Clear</span>
      </div>
    </div>

    <!-- Right Panel: Virtual Terminal in Deep Canopy Green (#083305) -->
    <div class="ide-panel ide-panel-terminal">
      <div class="ide-toolbar">
        <div class="ide-toolbar-left">
          <span class="ide-toolbar-title">Virtual Terminal</span>
          <span id="timing-badge" class="ide-timing-badge" style="display: none;">• 0.0 ms</span>
        </div>

        <div class="ide-toolbar-right">
          <button class="ide-btn" id="btn-clear-term" title="Clear console output">Clear Console</button>
        </div>
      </div>

      <div class="ide-terminal-area" id="terminal-screen">
        <div class="term-line sys">Kuroba (KRB) Web Runtime Engine v1.0.6</div>
        <div class="term-line sys">Type your code on the left and click [Run ▶] or press [Ctrl + Enter].</div>
      </div>
    </div>

  </main>

  <!-- Kuroba Web Engine and Controller Scripts -->
  <script src="js/kuroba-web.js"></script>
  <script src="js/playground.js"></script>
</body>
</html>
