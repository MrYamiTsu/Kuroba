<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Playground — Kuroba</title>
  <link rel="icon" type="image/png" href="assets/kuroba.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body class="ide-body">

  <!-- ========================================================================
       Header / Navigation Bar
       ======================================================================== -->
  <header class="site-header">
    <a href="index.html" class="brand">
      <img src="assets/kuroba.png" alt="Kuroba Logo" class="logo">
      <span class="brand-name">Kuroba</span>
      <span class="version-badge">v1.1.0</span>
    </a>

    <nav class="main-nav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="docs.html" class="nav-link">Documentation</a>
      <a href="learn.html" class="nav-link">Learn</a>
      <a href="playground.html" class="nav-link active">Playground ▶</a>
    </nav>
  </header>

  <!-- ========================================================================
       Playground Fullscreen Interface (Editor 50% | Terminal 50%)
       ======================================================================== -->
  <main class="playground-fullscreen">
    
    <!-- Left Panel: Code Editor -->
    <div class="ide-panel ide-panel-editor">
      <div class="ide-toolbar">
        <div class="ide-toolbar-left">
          <span class="ide-toolbar-title">Editor</span>
        </div>

        <div class="ide-toolbar-right">
          <button class="ide-btn" id="btn-clear-editor" title="Clear active file content">Clear</button>
          <button class="ide-btn ide-btn-stop" id="btn-stop" title="Stop execution (Ctrl + C)" style="display: none;">Stop ■</button>
          <button class="ide-btn ide-btn-run" id="btn-execute" title="Run main.krb (Ctrl + Enter)">Run main.krb ▶</button>
        </div>
      </div>

      <!-- Multi-File Workspace Tabs (main.krb is pinned as entry point) -->
      <div class="ide-file-tabs" id="ide-file-tabs">
        <div class="ide-file-tabs-list" id="ide-file-tabs-list"></div>
        <button class="ide-add-file-btn" id="btn-add-file" title="Create new .krb module file">+ New File</button>
      </div>

      <!-- Editor Body with Synchronized Line Numbers -->
      <div class="ide-editor-container">
        <div class="ide-line-numbers" id="ide-gutter"></div>
        <textarea class="ide-textarea" id="ide-editor" spellcheck="false" placeholder="Write Kuroba (.krb) code here..."></textarea>
      </div>

      <!-- Bottom Status Bar -->
      <div class="ide-statusbar">
        <span class="ide-status-item" id="status-active-file">
          <span class="status-indicator">●</span> Entry: main.krb
        </span>
        <span class="ide-status-item" id="status-cursor">Ln 1, Col 1</span>
        <span class="ide-status-item ide-shortcuts-hint">[Ctrl+Enter] Run &nbsp;•&nbsp; [Ctrl+L] Clear &nbsp;•&nbsp; [Ctrl+/] Comment</span>
      </div>
    </div>

    <!-- Right Panel: Virtual Terminal in Deep Canopy Green (#083305) -->
    <div class="ide-panel ide-panel-terminal">
      <div class="ide-toolbar">
        <div class="ide-toolbar-left">
          <span class="ide-toolbar-title">Virtual Terminal</span>
          <span id="timing-badge" class="ide-timing-badge" style="display: none;">• 0.0 ms</span>
        </div>

        <div class="ide-toolbar-right">
          <button class="ide-btn" id="btn-clear-term" title="Clear console output">Clear Console</button>
        </div>
      </div>

      <div class="ide-terminal-area" id="terminal-screen">
        <div class="term-line sys">Kuroba (KRB) Web Runtime Engine v1.1.0</div>
        <div class="term-line sys">Type your code on the left and click [Run ▶] or press [Ctrl + Enter].</div>
      </div>
    </div>

  </main>

  <!-- Kuroba Native C WebAssembly Engine and Controller -->
  <script>
    (function() {
      var outBytes = [];
      var errBytes = [];
      var utf8Decoder = new TextDecoder('utf-8');

      function flushBuffer(buf, isErr, hasNewline) {
        if (buf.length === 0 && !hasNewline) return;
        var text = utf8Decoder.decode(new Uint8Array(buf));
        buf.length = 0;
        if (isErr) {
          if (window.__kuroba_error) window.__kuroba_error(text);
          else console.error(text);
        } else {
          if (window.__kuroba_print) window.__kuroba_print(text, hasNewline);
          else console.log(text);
        }
      }

      window.Module = {
        preRun: [function() {
          Module.FS.init(
            null,
            function(ch) {
              if (ch === null) return;
              if (ch === 10) flushBuffer(outBytes, false, true);
              else if (ch !== 13) outBytes.push(ch & 0xff);
            },
            function(ch) {
              if (ch === null) return;
              if (ch === 10) flushBuffer(errBytes, true, true);
              else if (ch !== 13) errBytes.push(ch & 0xff);
            }
          );
        }],
        onRuntimeInitialized: function() {
          Module._krb_wasm_init();
          window.Kuroba = {
            version: '1.1.1 (Native C WASM)',
            isReady: true,
            run: async function(code, options) {
              if (Module._krb_wasm_reset) Module._krb_wasm_reset();
              outBytes.length = 0;
              errBytes.length = 0;
              const onPrint = (options && options.onPrint) || console.log;
              const onError = (options && options.onError) || ((err) => onPrint(err, true));
              window.__kuroba_print = onPrint;
              window.__kuroba_error = onError;

              if (options && options.files && Module.FS) {
                for (var f in options.files) {
                  try {
                    Module.FS.writeFile(f, options.files[f]);
                  } catch(e) {}
                }
              }

              try {
                return Module.ccall('krb_wasm_run', 'number', ['string'], [code]);
              } finally {
                if (outBytes.length > 0) flushBuffer(outBytes, false, false);
                if (errBytes.length > 0) flushBuffer(errBytes, true, false);
                window.__kuroba_print = null;
                window.__kuroba_error = null;
              }
            },
            reset: function() {
              outBytes.length = 0;
              errBytes.length = 0;
              if (Module._krb_wasm_reset) Module._krb_wasm_reset();
            },
            abort: function() {}
          };
          var term = document.getElementById('terminal-screen');
          if (term) {
            var line = document.createElement('div');
            line.className = 'term-line ok';
            line.textContent = '>> Kuroba Native C WebAssembly Engine (v1.1.1) ready.';
            term.appendChild(line);
          }
        }
      };
    })();
  </script>
  <script src="js/kuroba-engine.js"></script>
  <script src="js/playground.js"></script>
</body>
</html>
